# Logrotate configuration for Day 05 synthetic logs
# The placeholder @LABDIR@ will be replaced at runtime with the absolute path to the lab-workdir.

@LABDIR@/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 $USER adm
    olddir @LABDIR@/logs/old
    sharedscripts
    postrotate
        # No service to reload – placeholder for demo
        echo "Logrotate postrotate executed for Day 05 lab"
    endscript
}
